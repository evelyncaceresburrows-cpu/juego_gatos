<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#FBF1D8" />

    <!-- PWA — auditoría §3.8. Manifest + iOS standalone meta tags.
         "Add to home screen" lo deja como app standalone con icono. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ADE" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ─── Meta básicos ───────────────────────────────────────────── -->
    <title>ADE — el gato que caza ideas</title>
    <meta name="description" content="Un gato que juega contigo 30 segundos para ayudarte a pensar mejor. Captura chispas, fusiona ideas, descubre tu modo creativo." />
    <link rel="canonical" href="https://juego-gatos.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- ─── Open Graph (Facebook, WhatsApp, iMessage, LinkedIn) ────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://juego-gatos.vercel.app/" />
    <meta property="og:title" content="ADE — el gato que caza ideas" />
    <meta property="og:description" content="Un gato que juega contigo 30 segundos para ayudarte a pensar mejor. Captura chispas, fusiona ideas, descubre tu modo creativo." />
    <meta property="og:image" content="https://juego-gatos.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://juego-gatos.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ade, gato dorado con manchas, sentado sobre fondo crema con halo dorado y el título ADE" />
    <meta property="og:site_name" content="ADE" />
    <meta property="og:locale" content="es_CL" />

    <!-- ─── Twitter / X ────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ADE — el gato que caza ideas" />
    <meta name="twitter:description" content="Un gato que juega contigo 30 segundos para ayudarte a pensar mejor. Captura chispas, fusiona ideas, descubre tu modo creativo." />
    <meta name="twitter:image" content="https://juego-gatos.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Ade, gato dorado con manchas, sentado sobre fondo crema" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
